spring:
  application:
    name: backend

  config:
    import: "optional:file:.env[.properties]"

  # Email con Resend
  mail:
    host: smtp.resend.com
    port: 587
    username: "resend" # OJO: El usuario siempre es literalmente la palabra "resend"
    password: "${RESEND_API_KEY}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Conexion a la base de datos PostgreSQL (contenedor Docker "visium-postgres")
  datasource:
    url: "${DB_URL:${URL}}"
    username: "${DB_USERNAME:${USERNAME}}"
    password: "${DB_PASSWORD:${PASSWORD}}"

  jpa:
    hibernate:
      # "update" = Hibernate ajusta tablas; data.sql carga roles
      ddl-auto: update
    # Permite ejecutar data.sql despues de que existan las tablas
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Carga data.sql (roles) en cada arranque; los INSERT usan ON CONFLICT
  sql:
    init:
      mode: always

# Configuracion propia de VISIUM (JWT)
visium:
  jwt:
    # Clave secreta para firmar tokens (en produccion debe ir en variable de entorno)
    secret: "${JWT_SECRET}"
    # Duracion del token: 24 horas (en milisegundos)
    expiration-ms: 86400000

# Documentacion API con Swagger (springdoc)
springdoc:
  api-docs:
    path: /api-docs
  show-actuator: false
